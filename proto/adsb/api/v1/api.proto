// The services adsb offers its UI. One WebSocket connection carries calls to any of them, framed by
// proto/wsrpc/v1/wsrpc.proto; doc/design/ui_api.md describes the protocol. A server serves only the services
// it has: the hello's answer lists them.

syntax = "proto3";

package adsb.api.v1;

// ---- Services ----

// The live pipeline. Served with a live input, not by `serve`.
service Receiver {
  rpc GetReceiverInfo(GetReceiverInfoRequest) returns (ReceiverInfo);

  // The frames decoded, a batch per interval that has any.
  rpc WatchFrames(WatchFramesRequest) returns (stream FrameBatch);
  // The aircraft: every one heard in the last 600 s at once, then those that changed, per interval that has any.
  rpc WatchAircraft(WatchAircraftRequest) returns (stream AircraftChanges);
  // The input's status, once there is one, then at each change.
  rpc WatchInputStatus(WatchInputStatusRequest) returns (stream InputStatus);
  // The spectrum's rows as they're computed. The server computes them only while one of these calls is open.
  rpc WatchSpectrum(WatchSpectrumRequest) returns (stream SpectrumRow);

  // The settings clients set, now and at each change, from any client.
  rpc WatchSettings(WatchSettingsRequest) returns (stream Settings);
  // Changes the settings for every client; replies with them as they are after the change.
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings);

  // Records one point of the pipeline to a SigMF recording in Settings.capture_dir, from the next block on,
  // reporting its progress. One capture per point at a time; cancelling stops it, keeping what's written.
  rpc RecordCapture(RecordCaptureRequest) returns (stream RecordCaptureProgress);
  // The recordings in the capture directory: every .sigmf-data there, whoever wrote it.
  rpc ListCaptures(ListCapturesRequest) returns (ListCapturesResponse);
}

// The history database. Served with --history-db.
service History {
  // Every aircraft as it was at a time, with its track up to then.
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot);
  // One aircraft's values over time, up to a time.
  rpc GetAircraftHistory(GetAircraftHistoryRequest) returns (AircraftHistory);
  // How many aircraft were heard, per time bucket.
  rpc GetActivity(GetActivityRequest) returns (Activity);
  // How many flights crossed each cell of an area.
  rpc GetHeatmap(GetHeatmapRequest) returns (Heatmap);
}

// ---- Receiver: info and live data ----

message GetReceiverInfoRequest {}

// Fixed for the run.
message ReceiverInfo {
  string source = 1;              // the subcommand: "file", "vita49", "rtlsdr", "sidekiq" or "uhd"
  double default_interval_s = 2;  // --ws-interval: a watch's interval when its request leaves it unset
  double max_capture_s = 3;       // the longest RecordCapture takes
}

message WatchFramesRequest {
  optional double interval_s = 1;  // unset for ReceiverInfo.default_interval_s; at least 0.1, at most 3600
}

message FrameBatch {
  repeated Frame frames = 1;  // in the order they were decoded
  bool frames_dropped = 2;    // some before these were dropped, as the client read too slowly
}

message Frame {
  uint64 idx = 1;  // stream sample index of the preamble
  uint32 bits = 2;
  float confidence = 3;
  uint32 df = 4;
  optional uint32 icao = 5;  // unset when the address isn't known
  bool crc_ok = 6;
  bool crc_checked = 7;  // false for DF19/22
  optional uint32 crc_fixed_bit = 8;
  bytes payload = 9;  // bits / 8 bytes, first bit in the top bit of byte 0
  string summary = 10;  // empty when there's none
}

message WatchAircraftRequest {
  optional double interval_s = 1;  // unset for ReceiverInfo.default_interval_s; at least 0.1, at most 3600
}

message AircraftChanges {
  repeated Aircraft aircraft = 1;  // each as last published
}

message Aircraft {
  uint32 icao = 1;
  optional string callsign = 2;
  optional string category = 3;
  optional string squawk = 4;
  optional int32 altitude_ft = 5;
  optional double lat = 6;
  optional double lon = 7;
  optional double ground_speed_kt = 8;
  optional double track_deg = 9;
  optional int32 vertical_rate_fpm = 10;
  optional double heading_deg = 11;
  optional int32 ias_kt = 12;
  optional int32 tas_kt = 13;
  optional double mach = 14;
  optional double roll_deg = 15;
  optional bool on_ground = 16;
  bool alert = 17;
  bool spi = 18;
  optional int32 selected_altitude_ft = 19;
  enum AltitudeSource {
    ALTITUDE_SOURCE_UNSPECIFIED = 0;
    MCP = 1;
    FMS = 2;
  }
  optional AltitudeSource selected_altitude_source = 20;
  optional double selected_heading_deg = 21;
  optional double baro_setting_hpa = 22;
  AutopilotModes autopilot_modes = 23;  // unset until target state arrives
  optional int32 adsb_version = 24;
  optional int32 nac_p = 25;
  optional int32 sil = 26;
  uint64 messages = 27;
  optional double signal_db = 28;
  double last_seen_s = 29;
  double last_seen_unix_s = 30;
}

// Wrapped so that "not known yet" (unset) differs from "none engaged" (empty).
message AutopilotModes {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    AP = 1;
    VNAV = 2;
    ALT = 3;
    APP = 4;
    LNAV = 5;
  }
  repeated Mode modes = 1;
}

message WatchInputStatusRequest {}

message InputStatus {
  double window_s = 1;
  double rate_hz = 2;
  double stream_s = 3;
  double lost_s = 4;
  double dropped_s = 5;
  optional uint64 kernel_drops = 6;
  bool ok = 7;
  string summary = 8;
}

message WatchSpectrumRequest {}

message SpectrumRow {
  double freq_hz = 1;
  double rate_hz = 2;
  repeated float bins_db = 3;
}

// ---- Receiver: settings ----

message WatchSettingsRequest {}

// Each reply of WatchSettings is the whole of it.
message Settings {
  string capture_dir = 1;  // where RecordCapture writes, absolute; empty with captures off. Starts as --capture-dir
}

// Each field set is changed; each unset is left as it is.
message UpdateSettingsRequest {
  // An existing, writable directory on the server, relative to its working directory or absolute; empty turns
  // captures off. A capture in progress carries on in the directory it started in.
  optional string capture_dir = 1;
}

// ---- Receiver: captures ----

enum CapturePoint {
  CAPTURE_POINT_UNSPECIFIED = 0;
  INPUT = 1;     // the input IQ after stitching, as the source delivered it: replayable with `adsb file`
  ENVELOPE = 2;  // the demodulator's resampled envelope magnitude, real float32 at its output rate
}

message RecordCaptureRequest {
  CapturePoint point = 1;
  double duration_s = 2;  // stream time; over 0, and at most ReceiverInfo.max_capture_s
  string name = 3;        // file name in the capture directory: no '/', not starting with '.'; .sigmf-data/-meta
                          // added. An existing name is refused.
}

// About twice a second while the capture runs, and a last one when it has covered its duration or the input
// ended first.
message RecordCaptureProgress {
  uint64 start_index = 1;  // the point's stream index of the first sample: an input index is Frame.idx's
  uint64 samples = 2;      // samples written so far
  uint64 missing = 3;      // samples not written so far: dropped behind a slow disk, or lost by the source; each
                           // gap starts a new SigMF capture segment
  Capture capture = 4;     // on the last reply only: the recording as written
}

message ListCapturesRequest {}

message ListCapturesResponse {
  string dir = 1;                 // the capture directory listed
  repeated Capture captures = 2;  // newest first, at most 1000
  uint32 not_listed = 3;          // older ones beyond those
}

// One recording in the capture directory.
message Capture {
  string name = 1;             // without .sigmf-data, as RecordCaptureRequest.name
  string data_path = 2;        // the .sigmf-data on the server; its .sigmf-meta is beside it
  uint64 data_bytes = 3;
  double modified_unix_s = 4;  // the .sigmf-data's last write
  CaptureMeta meta = 5;        // unset when the .sigmf-meta is missing or invalid
}

// What a recording's .sigmf-meta says.
message CaptureMeta {
  string datatype = 1;          // core:datatype, e.g. "cf32_le"
  double rate_hz = 2;           // core:sample_rate
  optional double freq_hz = 3;  // the first segment's core:frequency, if it has one
  string description = 4;       // core:description
  double duration_s = 5;        // of the samples in the .sigmf-data, from its size, datatype and rate
}

// ---- History ----

message GetSnapshotRequest {
  optional double t = 1;  // Unix s; unset for the latest
}

message Snapshot {
  double t = 1;
  optional double t_min = 2;  // the database's span; unset when it's empty
  optional double t_max = 3;
  message Entry {
    Aircraft state = 1;
    repeated TrackPoint track = 2;  // oldest first
  }
  repeated Entry aircraft = 4;
}

message TrackPoint {
  double lat = 1;
  double lon = 2;
  optional int32 altitude_ft = 3;
}

message GetAircraftHistoryRequest {
  uint32 icao = 1;
  optional double t = 2;  // Unix s; unset for its latest update
}

message AircraftHistory {
  double t = 1;
  message Point {
    double t = 1;
    optional int32 altitude_ft = 2;
    optional double ground_speed_kt = 3;
    optional int32 vertical_rate_fpm = 4;
    optional double signal_db = 5;
    optional int32 selected_altitude_ft = 6;
  }
  repeated Point points = 2;  // oldest first
}

message GetActivityRequest {
  optional double from = 1;  // Unix s; unset for the whole database
}

message Activity {
  double bucket_s = 1;
  optional double t0 = 2;  // unset when there are no buckets
  repeated uint32 counts = 3;
}

message GetHeatmapRequest {
  double west = 1;
  double south = 2;
  double east = 3;
  double north = 4;
  uint32 width = 5;
  uint32 height = 6;
  optional double t0 = 7;  // Unix s; unset for the database's start
  optional double t1 = 8;  // Unix s; unset for its end
}

message Heatmap {
  uint32 max = 1;
  // The nonzero cells: row-major index (row 0 at the north) and flight count, one pair per position.
  repeated uint32 cell_index = 2;
  repeated uint32 cell_count = 3;
}
